<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-label="standup — yesterday's commits, every repo, every branch">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12161f"/>
      <stop offset="100%" stop-color="#1b2430"/>
    </linearGradient>
    <style>
      .mono { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace; }
      .sans { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="960" height="240" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="960" height="3" rx="1.5" fill="#f5c518"/>

  <!-- wordmark -->
  <text class="mono" x="56" y="98" font-size="52" font-weight="700" fill="#e9edf3" letter-spacing="-1">
    standup
  </text>
  <text class="sans" x="56" y="134" font-size="19" fill="#9aa7b8">
    Yesterday's commits. Every repository, every branch.
  </text>

  <!-- terminal sample -->
  <g transform="translate(56,164)">
    <text class="mono" x="0" y="0" font-size="14" fill="#7f8ea3">$ standup</text>
    <text class="mono" x="0" y="24" font-size="14" fill="#f5c518">#weathercast</text>
    <text class="mono" x="130" y="24" font-size="14" fill="#8fb7a0">• Retry the forecast fetch before falling back to cache</text>
    <text class="mono" x="0" y="46" font-size="14" fill="#f5c518">#ledgerly</text>
    <text class="mono" x="130" y="46" font-size="14" fill="#8fb7a0">• Reconcile split transactions against the statement</text>
  </g>

  <!-- accent marks, right -->
  <g opacity="0.9">
    <rect x="792" y="56" width="112" height="10" rx="5" fill="#2a3648"/>
    <rect x="792" y="80" width="72"  height="10" rx="5" fill="#2a3648"/>
    <rect x="792" y="104" width="96" height="10" rx="5" fill="#f5c518" opacity="0.85"/>
    <rect x="792" y="128" width="56" height="10" rx="5" fill="#2a3648"/>
    <rect x="792" y="152" width="88" height="10" rx="5" fill="#2a3648"/>
  </g>
</svg>
